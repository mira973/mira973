<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .fade { opacity: 0; animation: fade .45s ease forwards; }
    .d1 { animation-delay: .15s; }
    .d2 { animation-delay: .6s; }
    .d3 { animation-delay: 1.05s; }
    .d4 { animation-delay: 1.5s; }
    .d5 { animation-delay: 1.95s; }
    .d6 { animation-delay: 2.4s; }
    .d7 { animation-delay: 2.85s; }
    .blink { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="68" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EE787"/>
      <stop offset=".52" stop-color="#79C0FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="998" height="328" rx="22" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="52" rx="22" fill="#161B22"/>
  <rect x="1" y="30" width="998" height="22" fill="#161B22"/>

  <circle cx="27" cy="26" r="6" fill="#FF5F56"/>
  <circle cx="49" cy="26" r="6" fill="#FFBD2E"/>
  <circle cx="71" cy="26" r="6" fill="#27C93F"/>
  <text x="500" y="32" text-anchor="middle" class="mono" font-size="14" fill="#8B949E">mira973 — github profile</text>

  <text x="56" y="94" class="mono fade d1" font-size="18" fill="#7EE787">mira973@github:~$</text>
  <text x="263" y="94" class="mono fade d1" font-size="18" fill="#C9D1D9">whoami</text>

  <text x="56" y="139" class="mono fade d2" font-size="30" font-weight="700" fill="#F0F6FC">Miroslav</text>
  <text x="56" y="173" class="mono fade d3" font-size="18" fill="#C9D1D9">Frontend Developer · Intern</text>
  <text x="56" y="203" class="mono fade d4" font-size="18" fill="#8B949E">Student @ Hexlet College</text>

  <rect x="56" y="231" width="888" height="1" fill="url(#accent)" opacity=".75" class="fade d5"/>

  <text x="56" y="267" class="mono fade d5" font-size="16" fill="#79C0FF">building</text>
  <circle cx="133" cy="261" r="5" fill="#7EE787" class="pulse fade d5"/>
  <text x="148" y="267" class="mono fade d5" font-size="16" fill="#F0F6FC">P2P AirDrop</text>

  <text x="327" y="267" class="mono fade d6" font-size="16" fill="#A78BFA">next</text>
  <circle cx="382" cy="261" r="5" fill="#6E7681" class="fade d6"/>
  <text x="397" y="267" class="mono fade d6" font-size="16" fill="#C9D1D9">Secure Messenger</text>

  <text x="56" y="303" class="mono fade d7" font-size="15" fill="#8B949E">architecture · realtime · networking · databases</text>
  <rect x="511" y="289" width="10" height="18" rx="1" fill="#7EE787" class="blink fade d7"/>
</svg>
